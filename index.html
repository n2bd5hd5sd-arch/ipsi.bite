<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>입시먹방 공부 적성 MBTI 테스트 | @ipsi.bite</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #0b0d11;
      --card: #151a22;
      --card-2: #1c222d;
      --mint: #2ce5a8;
      --gold: #ffd044;
      --text: #f5f7fa;
      --muted: #9aa6b8;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 0%, #132220 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      padding: 20px 18px 40px;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: var(--mint);
      margin-bottom: 18px;
    }
    .brand span.tag {
      background: rgba(44,229,168,0.12);
      border: 1px solid rgba(44,229,168,0.3);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
    }
    .screen { display: none; flex-direction: column; flex: 1; animation: fadeUp .28s ease; }
    .screen.active { display: flex; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Intro */
    .hero-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 22px;
      text-align: center;
      margin-top: 8px;
    }
    .pudding-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .pudding-row img {
      width: 62px;
      height: 62px;
      object-fit: contain;
      animation: bob 2.2s ease-in-out infinite;
    }
    .pudding-row img:nth-child(2) { animation-delay: .25s; }
    .pudding-row img:nth-child(3) { animation-delay: .5s; }
    .pudding-row img:nth-child(4) { animation-delay: .75s; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    h1 { font-size: 26px; line-height: 1.3; margin: 0 0 10px; font-weight: 800; }
    .sub { font-size: 15px; color: var(--muted); line-height: 1.55; margin: 0 0 22px; }
    .pill-info {
      display: inline-flex;
      gap: 10px;
      background: var(--card-2);
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 22px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--mint); color: #09100e; }
    .btn-secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }

    /* Quiz */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mint), #7bf5cb);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .progress-num { font-size: 13px; font-weight: 700; color: var(--mint); min-width: 42px; text-align: right; }
    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 26px 20px;
      margin-bottom: 16px;
    }
    .q-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .q-title { font-size: 20px; line-height: 1.45; font-weight: 800; margin: 0; }
    .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .choice-btn {
      text-align: left;
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 18px 18px;
      font-size: 15px;
      line-height: 1.48;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s ease;
    }
    .choice-btn:hover, .choice-btn:active {
      border-color: var(--mint);
      background: rgba(44,229,168,0.08);
    }
    .back-link {
      margin-top: auto;
      padding-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }

    /* Result */
    .res-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      padding: 26px 20px;
      text-align: center;
    }
    .res-type-code {
      display: inline-block;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .res-img { width: 132px; height: 132px; object-fit: contain; margin: 4px auto 12px; display: block; }
    .res-name { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
    .res-quote { font-size: 14px; color: var(--gold); font-weight: 700; margin: 0 0 18px; }
    .res-desc { font-size: 14.5px; line-height: 1.6; color: #d7dee8; text-align: left; background: var(--card-2); padding: 16px; border-radius: 18px; margin-bottom: 14px; }
    .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-bottom: 18px; }
    .mini-box { background: var(--card-2); padding: 13px; border-radius: 16px; }
    .mini-label { font-size: 11.5px; font-weight: 800; color: var(--mint); margin-bottom: 5px; }
    .mini-val { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--mint); color: #09100e; font-weight: 800; font-size: 13.5px;
      padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <span>@ipsi.bite · 입시먹방</span>
      <span class="tag">공부 적성 MBTI</span>
    </div>

    <!-- Intro -->
    <section id="screen-intro" class="screen active">
      <div class="hero-box">
        <div class="pudding-row">
          <img src="assets/pudding-mint.png" alt="민트 푸딩" />
          <img src="assets/pudding-gold.png" alt="골드 푸딩" />
          <img src="assets/pudding-pink.png" alt="핑크 푸딩" />
          <img src="assets/pudding-sky.png" alt="스카이 푸딩" />
        </div>
        <h1>내 공부 적성 푸딩은<br/>무슨 색일까? 🍮</h1>
        <p class="sub">
          9개의 질문으로 알아보는<br/>
          내 공부 스타일 × 찰떡 입시 전략 × 단짝 메이트!
        </p>
        <div class="pill-info">⏱️ 1분 컷 · 8가지 푸딩 유형</div>
        <button class="btn btn-primary" onclick="startQuiz()">검사 시작하기</button>
      </div>
    </section>

    <!-- Quiz -->
    <section id="screen-quiz" class="screen">
      <div class="progress-wrap">
        <div class="progress-bar"><div id="prog-fill" class="progress-fill"></div></div>
        <div id="prog-num" class="progress-num">1 / 9</div>
      </div>
      <div class="q-card">
        <span id="q-badge" class="q-badge">Q1</span>
        <h2 id="q-title" class="q-title"></h2>
      </div>
      <div id="choices" class="choices"></div>
      <div class="back-link" onclick="prevQuestion()">← 이전 질문으로</div>
    </section>

    <!-- Result -->
    <section id="screen-result" class="screen">
      <div class="res-card" id="res-card">
        <span id="res-code" class="res-type-code"></span>
        <img id="res-img" class="res-img" src="" alt="결과 푸딩" />
        <h2 id="res-name" class="res-name"></h2>
        <p id="res-quote" class="res-quote"></p>
        <div id="res-desc" class="res-desc"></div>
        <div class="res-grid">
          <div class="mini-box">
            <div class="mini-label">🎯 찰떡 입시 전형</div>
            <div id="res-track" class="mini-val"></div>
          </div>
          <div class="mini-box">
            <div class="mini-label">🤝 환상의 공부 메이트</div>
            <div id="res-mate" class="mini-val"></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="copyResult()">내 결과 복사해서 스토리 공유하기</button>
          <button class="btn btn-secondary" onclick="restartQuiz()">다시 검사하기</button>
        </div>
      </div>
    </section>
  </div>
  <div id="toast" class="toast">결과가 복사됐어요! 인스타 스토리에 붙여넣기 해보세요 🙌</div>

  <script>

        img: "assets/pudding-coral.png",
        quote: "“디데이 다가올수록 두뇌 회전 300%”",
        desc: "평소엔 여유로워 보여도 마감·시험이 코앞에 닥치면 초인적인 순발력이 터지는 타입! 짧은 시간 안에 핵심만 쏙 뽑아내는 직관력이 뛰어나서 모의고사 역전 드라마의 주인공이 되기 쉽습니다.",
        track: "단기 집중 논술 · 막판 역전형",
        mate: "크림 푸딩 (PIS)"
      }
    };

    let idx = 0;
    let scores = [0, 0, 0]; // >0 = P/L/S, <0 = F/I/B
    let history = [];
    let currentCode = "PLS";

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      idx = 0; scores = [0, 0, 0]; history = [];
      renderQ();
      show('screen-quiz');
    }

    function renderQ() {
      const q = QUESTIONS[idx];
      document.getElementById('prog-fill').style.width = `${((idx + 1) / QUESTIONS.length) * 100}%`;
      document.getElementById('prog-num').innerText = `${idx + 1} / ${QUESTIONS.length}`;
      document.getElementById('q-badge').innerText = `QUESTION ${idx + 1}`;
      document.getElementById('q-title').innerText = q.q;
      const box = document.getElementById('choices');
      box.innerHTML = '';
      [q.a, q.b].forEach(([txt, side]) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = txt;
        btn.onclick = () => pick(q.axis, side);
        box.appendChild(btn);
      });
    }

    function pick(axis, side) {
      const delta = (side === 'P' || side === 'L' || side === 'S') ? 1 : -1;
      scores[axis] += delta;
      history.push({ axis, delta });
      if (idx + 1 < QUESTIONS.length) {
        idx++;
        renderQ();
      } else {
        showResult();
      }
    }

    function prevQuestion() {
      if (idx === 0) { show('screen-intro'); return; }
      const last = history.pop();
      if (last) scores[last.axis] -= last.delta;
      idx--;
      renderQ();
    }

    function showResult() {
      const c0 = scores[0] >= 0 ? 'P' : 'F';
      const c1 = scores[1] >= 0 ? 'L' : 'I';
      const c2 = scores[2] >= 0 ? 'S' : 'B';
      currentCode = c0 + c1 + c2;
      const t = TYPES[currentCode];

      const badge = document.getElementById('res-code');
      badge.innerText = `${currentCode} TYPE`;
      badge.style.background = `${t.color}22`;
      badge.style.color = t.color;
      badge.style.border = `1px solid ${t.color}66`;

      document.getElementById('res-card').style.borderColor = `${t.color}55`;
      document.getElementById('res-img').src = t.img;
      document.getElementById('res-name').innerText = t.name;
      document.getElementById('res-quote').innerText = t.quote;
      document.getElementById('res-desc').innerText = t.desc;
      document.getElementById('res-track').innerText = t.track;
      document.getElementById('res-mate').innerText = t.mate;
      show('screen-result');
    }

    function copyResult() {
      const t = TYPES[currentCode];
      const msg = `[입시먹방 공부 적성 MBTI] 내 결과는 '${t.name}' (${currentCode})!\n${t.quote}\n🎯 추천 전형: ${t.track}\n@ipsi.bite 프로필 링크에서 너도 해봐!`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(msg);
      }
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function restartQuiz() { startQuiz(); }
  </script>
</body>
</html>
